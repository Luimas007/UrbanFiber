name: Deploy to GitHub Pages

# Publishes the public/ directory as the site. This repo can equally be
# deployed on any other static host by pointing it at public/ as the
# publish directory — no platform-specific files or settings needed there.
#
# One-time setup for THIS workflow to take effect on GitHub Pages:
#   Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions"
# (Classic "Deploy from a branch" mode ignores this file entirely and
# would try to serve the repo root, which no longer holds the site.)

on:
  push:
    branches: [master]
    paths:
      - "public/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
