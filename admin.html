<style>
:root{
  --bg:#0d0d0d; --panel:#151515; --panel-2:#1c1c1c; --fg:#f2ede4; --muted:#9a938a;
  --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.22);
  --accent:#f2ede4; --accent-fg:#121212;
  --ok:#6bcf9a; --warn:#e0b050; --danger:#ff6b5e; --info:#7cc4ff;
  --r:1rem; --r-sm:.6rem; --r-pill:999px;
  --ease:cubic-bezier(.22,1,.36,1);
  --tap:2.75rem;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:400 15px/1.55 "Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.15;letter-spacing:-.01em}
p{margin:0}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.45}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.eyebrow{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.24em;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  min-height:var(--tap);padding:.7rem 1.15rem;border-radius:var(--r-pill);
  font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid transparent;transition:transform .2s var(--ease),background .2s,border-color .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn--p{background:var(--accent);color:var(--accent-fg)}
.btn--p:hover{opacity:.88}
.btn--g{border-color:var(--line-2)}
.btn--g:hover{background:rgba(255,255,255,.07);border-color:var(--fg)}
.btn--d{border-color:rgba(255,107,94,.4);color:var(--danger)}
.btn--d:hover{background:rgba(255,107,94,.12)}
.btn--sm{min-height:2.25rem;padding:.4rem .8rem;font-size:.65rem}
.btn--block{width:100%}

/* ---- login ---- */
#login{position:fixed;inset:0;display:grid;place-items:center;padding:1.25rem;background:var(--bg);z-index:50}
.login-card{width:100%;max-width:24rem;background:var(--panel);border:1px solid var(--line);
  border-radius:1.75rem;padding:2rem 1.75rem}
.login-card img{width:2.75rem;height:2.75rem;border-radius:var(--r-pill);object-fit:cover}

.confirm-scrim{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  padding:1.25rem;background:rgba(0,0,0,.6);backdrop-filter:blur(3px)}
.confirm-card{width:100%;max-width:22rem;background:var(--panel);border:1px solid var(--line-2);
  border-radius:1.25rem;padding:1.5rem}

/* ---- shell ---- */
#app{display:none;min-height:100dvh;flex-direction:column}
#app.on{display:flex}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  gap:.75rem;padding:.7rem 1rem;background:rgba(13,13,13,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.top__brand{display:flex;align-items:center;gap:.55rem;min-width:0}
.top__brand img{width:1.9rem;height:1.9rem;border-radius:var(--r-pill);object-fit:cover}
.top__brand b{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.15rem;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.tabs{display:flex;gap:.3rem;overflow-x:auto;padding:.55rem 1rem;border-bottom:1px solid var(--line);
  scrollbar-width:none;position:sticky;top:3.4rem;background:var(--bg);z-index:29}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:2.4rem;padding:.45rem .9rem;border-radius:var(--r-pill);
  border:1px solid var(--line);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);transition:background .2s,color .2s,border-color .2s}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
main{flex:1;padding:1.1rem 1rem 4rem;max-width:70rem;width:100%;margin-inline:auto}
@media(min-width:768px){ .tabs{top:3.6rem} main{padding:1.75rem 1.5rem 5rem} }

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem}
.card+.card{margin-top:.85rem}
.grid{display:grid;gap:.85rem}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem}
.stat b{display:block;font-size:2rem;line-height:1.1;margin-top:.35rem;font-variant-numeric:tabular-nums}

label.f{display:grid;gap:.35rem}
label.f>span{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.in{width:100%;min-height:2.9rem;padding:.7rem .9rem;border:1px solid var(--line-2);border-radius:var(--r-sm);
  background:rgba(255,255,255,.04);transition:border-color .2s,box-shadow .2s}
.in:focus{outline:none;border-color:var(--fg);box-shadow:0 0 0 3px rgba(255,255,255,.09)}
textarea.in{min-height:5rem;resize:vertical}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 1.1rem) 55%,calc(100% - .8rem) 55%;background-size:.35rem .35rem;background-repeat:no-repeat;padding-right:2.4rem}
select.in option{background:var(--panel);color:var(--fg)}
.check{display:flex;align-items:center;gap:.7rem;min-height:var(--tap);padding:.6rem .9rem;
  border:1px solid var(--line);border-radius:var(--r-sm);font-size:.85rem;cursor:pointer}
.check input{width:1.15rem;height:1.15rem;accent-color:var(--accent);flex:none}
.hint{font-size:.72rem;color:var(--muted);line-height:1.5}

/* product rows */
.row{display:grid;grid-template-columns:3.5rem 1fr auto;gap:.8rem;align-items:center;
  padding:.7rem;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-2)}
.row+.row{margin-top:.5rem}
.row__img{width:3.5rem;aspect-ratio:4/5;border-radius:.45rem;object-fit:cover;background:#222}
.row__b{min-width:0}
.row__t{font-weight:600;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row__m{font-size:.72rem;color:var(--muted);margin-top:.15rem}
.row__a{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-block;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
  padding:.18rem .5rem;border-radius:var(--r-pill);border:1px solid currentColor}
.pill--ok{color:var(--ok)} .pill--warn{color:var(--warn)} .pill--off{color:var(--muted)}
.pill--sale{color:var(--danger)} .pill--info{color:var(--info)}

.strike{text-decoration:line-through;color:var(--muted)}

/* variants */
.vrow{display:grid;gap:.6rem;padding:.8rem;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-2)}
.vrow+.vrow{margin-top:.5rem}
.vrow__top{display:flex;align-items:center;gap:.7rem}
.sw{width:2.4rem;height:2.4rem;border-radius:.5rem;border:1px solid var(--line);flex:none}
.vprev{width:3rem;aspect-ratio:4/5;object-fit:cover;border-radius:.35rem;background:#222;flex:none}

/* orders */
.ord{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:1rem}
.ord+.ord{margin-top:.7rem}
.ord__h{display:flex;justify-content:space-between;gap:.7rem;flex-wrap:wrap;align-items:flex-start}
.ord__items{margin-top:.7rem;padding-top:.7rem;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);display:grid;gap:.25rem}
.ord__a{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.85rem}

.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.spin{width:1.5rem;height:1.5rem;border:2px solid var(--line-2);border-top-color:var(--fg);
  border-radius:50%;animation:sp .7s linear infinite;margin:2.5rem auto}
@keyframes sp{to{transform:rotate(360deg)}}
.err-box{border:1px solid rgba(255,107,94,.4);background:rgba(255,107,94,.08);color:var(--danger);
  padding:.8rem 1rem;border-radius:var(--r-sm);font-size:.82rem}

#toast{position:fixed;left:50%;bottom:1.25rem;transform:translate(-50%,1.5rem);opacity:0;z-index:100;
  background:var(--accent);color:var(--accent-fg);padding:.8rem 1.2rem;border-radius:var(--r-pill);
  font-size:.82rem;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.5);pointer-events:none;
  transition:opacity .3s,transform .3s var(--ease);max-width:calc(100% - 2rem);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast[data-t=err]{background:var(--danger);color:#fff}

.sticky-save{position:sticky;bottom:0;display:flex;gap:.5rem;padding:.75rem;margin-top:1rem;
  background:rgba(13,13,13,.94);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1.5rem">
      <img src="Materials/uf.jpg" alt="">
      <div><p class="eyebrow">UrbanFiber</p><h1 style="font-size:1.35rem;text-transform:uppercase">Control</h1></div>
    </div>
    <p class="muted" style="font-size:.85rem;margin-bottom:1.25rem">Administrator sign-in required.</p>
    <form id="login-form" style="display:grid;gap:.85rem">
      <label class="f"><span>Email</span>
        <input class="in" name="email" type="email" autocomplete="username" required></label>
      <label class="f"><span>Password</span>
        <input class="in" name="password" type="password" autocomplete="current-password" required></label>
      <p class="err-box" id="login-err" hidden></p>
      <button class="btn btn--p btn--block" type="submit">Sign in</button>
    </form>
    <a href="/" class="btn btn--g btn--block" style="margin-top:.75rem">Back to store</a>
  </div>
</div>

<div id="app">
  <div class="top">
    <div class="top__brand">
      <img src="Materials/uf.jpg" alt=""><b>UrbanFiber</b>
      <span class="pill pill--info" style="margin-left:.2rem">Admin</span>
    </div>
    <div style="display:flex;gap:.35rem">
      <a class="btn btn--g btn--sm" href="/" target="_blank" rel="noopener">View store</a>
      <button class="btn btn--g btn--sm" id="signout">Sign out</button>
    </div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="overview"  aria-selected="true">Overview</button>
    <button class="tab" role="tab" data-tab="products"  aria-selected="false">Products</button>
    <button class="tab" role="tab" data-tab="orders"    aria-selected="false">Orders</button>
    <button class="tab" role="tab" data-tab="sales"     aria-selected="false">Sales</button>
    <button class="tab" role="tab" data-tab="appearance"aria-selected="false">Homepage</button>
  </div>
  <main id="view"><div class="spin"></div></main>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/admin.js" defer></script>
</body>
</html>
